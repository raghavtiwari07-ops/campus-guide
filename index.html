<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusGuide - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 1100px;
            max-width: 100%;
            min-height: 650px;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        /* LEFT SIDE */

        .left {
            width: 48%;
            background: linear-gradient(
    rgba(23, 105, 224, 0.25),
    rgba(23, 105, 224, 0.55)
), url('campus.jpg') center center / cover no-repeat;
            color: white;
            padding: 55px 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            font-weight: normal;
        }

        .left-content {
            position: relative;
            z-index: 2;
        }

        .left-content h1 {
            font-size: 42px;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .left-content p {
            font-size: 17px;
            line-height: 1.6;
            max-width: 450px;
            opacity: 0.95;
        }

        .tagline {
            margin-top: 30px;
            font-size: 18px;
            font-style: italic;
            opacity: 0.9;
        }

        /* Simple campus illustration */

        .campus {
            position: absolute;
            bottom: -20px;
            left: 0;
            width: 100%;
            height: 250px;
            background: linear-gradient(
                to top,
                rgba(20, 80, 150, 0.55),
                transparent
            );
        }

        .building {
            position: absolute;
            bottom: 35px;
            left: 18%;
            width: 65%;
            height: 150px;
            background: rgba(255,255,255,0.25);
            border: 3px solid rgba(255,255,255,0.5);
            border-radius: 5px 5px 0 0;
        }

        .building:before {
            content: "";
            position: absolute;
            top: -55px;
            left: 20%;
            width: 60%;
            height: 55px;
            background: rgba(255,255,255,0.32);
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
        }

        .windows {
            position: absolute;
            top: 35px;
            left: 25px;
            right: 25px;
            height: 80px;
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(255,255,255,0.65) 0 20px,
                    transparent 20px 40px
                );
        }

        /* RIGHT SIDE */

        .right {
            width: 52%;
            padding: 65px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right h2 {
            font-size: 38px;
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            color: #344054;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1769e0;
            box-shadow: 0 0 0 3px rgba(23,105,224,0.1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #667085;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #667085;
        }

        .remember input {
            width: auto;
        }

        .forgot {
            color: #1769e0;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 9px;
            background: #1769e0;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1257bd;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #98a2b3;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e4e7ec;
        }

        .google-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid #d0d5dd;
            background: white;
            border-radius: 9px;
            font-size: 15px;
            cursor: pointer;
        }

        .google-btn:hover {
            background: #f8f9fa;
        }

        .register {
            text-align: center;
            margin-top: 28px;
            color: #667085;
            font-size: 14px;
        }

        .register a {
            color: #1769e0;
            font-weight: bold;
            text-decoration: none;
        }

        /* MOBILE */

        @media (max-width: 800px) {
            body {
                padding: 15px;
            }

            .container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                min-height: 350px;
                padding: 35px;
            }

            .left-content h1 {
                font-size: 32px;
            }

            .right {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="left">

            <div class="logo">
                📍 Campus<span>Guide</span>
            </div>

            <div class="left-content">

                <h1>
                    Welcome Back!
                </h1>

                <p>
                    Login to your account to continue
                    your campus journey.
                </p>

                <div class="tagline">
                    Explore · Navigate · Discover
                </div>

            </div>

            <div class="campus">
                <div class="building">
                    <div class="windows"></div>
                </div>
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="right">

            <h2>Login</h2>

            <p class="subtitle">
                Enter your credentials to access your account
            </p>

            <form>

                <div class="form-group">
                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Password</label>

                    <div class="password-box">

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter your password"
                            required
                        >

                        <span
                            class="show-password"
                            onclick="togglePassword()"
                        >
                            👁
                        </span>

                    </div>
                </div>


                <div class="options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" class="forgot">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="button"
                    class="login-btn"
                    onclick="loginUser()"
                >
                    Login
                </button>


                <div class="divider">
                    OR
                </div>


                <button
                    type="button"
                    class="google-btn"
                >
                    🌐 &nbsp; Continue with Google
                </button>

            </form>


            <div class="register">
                Don't have an account?
                <a href="#">
                    Register
                </a>
            </div>

        </div>

    </div>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }
        }


        function loginUser() {

            const email =
                document.querySelector('input[type="email"]').value;

            const password =
                document.getElementById("password").value;

            if (email === "" || password === "") {

                alert("Please enter your email and password.");

            } else {

                alert("Login button working! Backend will be connected later.");

            }
        }

    </script>

</body>
</html>
